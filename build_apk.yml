name: Build Alemny Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android wrapper if missing
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/alemny_scaffold
            flutter create --project-name alemny --org com.alemny.app --platforms=android /tmp/alemny_scaffold
            cp -r /tmp/alemny_scaffold/android ./android
          fi

      - name: Configure AndroidManifest HTTPS queries & Arabic label
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="alemny"/android:label="علمني"/' "$MANIFEST"
          if ! grep -q "android.intent.action.VIEW" "$MANIFEST"; then
            sed -i 's|<application>|<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries><application>|' "$MANIFEST"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alemny-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
